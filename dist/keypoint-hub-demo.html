a las horas, revisa \xABHoras bloqueadas:\xBB y toca \xABGuardar cambios\xBB. Para d\xEDas completos o periodos largos usa la opci\xF3n de abajo.",["admin","encargado"]],["Eventos","\xBFC\xF3mo publico un banner?","En Eventos y banners crea el evento o aviso, sube la imagen (1200 \xD7 400 px) y marca \xABPublicado\xBB. Ordena los banners con las flechas o por fecha.",["admin"]],["Eventos","\xBFPor qu\xE9 un banner est\xE1 en amarillo?","Ya termin\xF3 y no se muestra a los usuarios. Los eventos en curso siguen apareciendo hasta su t\xE9rmino (o hasta el final del d\xEDa si no tienen t\xE9rmino).",["admin"]],["Personas","Una persona pidi\xF3 eliminar sus datos","En Usuarios, sin escribir nada en la b\xFAsqueda, ves las solicitudes pendientes. Abre la ficha y toca \xABEliminar sus datos\xBB: se borran sus visitas, archivos, observaciones, avisos y los datos opcionales del perfil, y conserva certificaciones, horas, reservas y penalizaciones. Le llega un correo autom\xE1tico. Si se arrepinti\xF3, toca \xABDescartar solicitud\xBB.",["admin"]],["Personas","Restablecer una cuenta eliminada","Si la persona elimin\xF3 su cuenta y quiere volver sin acceso a su correo anterior, revisa su carnet. Al registrarla con su RUT, el sistema ofrece restablecer la cuenta con los datos nuevos; o en Usuarios abre su ficha y toca \xABRestablecer cuenta\xBB.",["recepcion"]],["Personas","\xBFC\xF3mo borro los datos de alguien?","En Usuarios abre su ficha y toca \xABBorrar datos o perfil\xBB. Elige historial, perfil o ambos, escribe tu contrase\xF1a de administraci\xF3n y confirma. No se puede deshacer.",["admin"]],["Personas","\xBFC\xF3mo doy credenciales a un empleado?","La persona primero crea su perfil de usuario. Luego en Empleados agr\xE9gala, marca sus credenciales y, si es encargado, sus laboratorios.",["admin"]],["Personas","\xBFC\xF3mo aplico una penalizaci\xF3n?","En la ficha de la persona: \xABRestringir acceso\xBB (administraci\xF3n) bloquea su entrada por un tiempo; \xABPenalizar horas\xBB (encargados) descuenta horas de laboratorio. Ambas se pueden levantar o compensar.",["admin","encargado"]],["Hub","\xBFC\xF3mo creo un laboratorio?","En Espacios crea el espacio, marca \xABExige certificaci\xF3n\xBB e indica el d\xEDa y la hora de la sesi\xF3n semanal: la certificaci\xF3n se crea sola.",["admin"]],["Laboratorios","\xBFC\xF3mo defino el periodo de una certificaci\xF3n?","En Certificaciones, en Configuraci\xF3n, indica \xABDesde\xBB y \xABHasta\xBB: las sesiones semanales se crean solo entre esas fechas. Elige el lugar de las sesiones y deja marcado \xABBloquear ese lugar\xBB para que nadie lo reserve a esa hora; las reservas que ya chocaban se cancelan y se avisa a cada persona.",["encargado"]],["Hub","\xBFD\xF3nde est\xE1 el QR de cada espacio?","En Espacios, abre el espacio: abajo est\xE1 su QR con el bot\xF3n \xABDescargar cartel para imprimir\xBB. Si alguien lo copia o se da\xF1a, toca \xABGenerar un QR nuevo\xBB (el anterior deja de servir). En Reglas indica la direcci\xF3n p\xFAblica de la app para que los QR abran la p\xE1gina correcta.",["admin","encargado"]],["Personas","\xBFC\xF3mo asigno una pasant\xEDa?","En Reglas elige la oficina de pasant\xEDa (con su aforo). Luego, en Usuarios, abre la ficha de la persona y toca \xABAsignar pasant\xEDa\xBB. Ver\xE1 el bot\xF3n de la oficina en su Inicio.",["admin"]],["Datos","\xBFC\xF3mo comparo mejor los gr\xE1ficos?","En Datos, sobre cada gr\xE1fico de barras toca una variable (por ejemplo, Cowork) para ocultarla: la escala se ajusta a las dem\xE1s. \xABMostrar todas\xBB la vuelve a mostrar.",["admin","analista"]],["Hub","\xBFC\xF3mo agrego un piso?","En Plano toca \xABAgregar piso\xBB, dibuja sus zonas y ajusta su aforo en Reglas.",["admin"]],["Datos","\xBFDe d\xF3nde salen las estad\xEDsticas?","De las visitas, reservas y perfiles. El analista ve identificadores an\xF3nimos. Descarga CSV desde Datos.",["admin","analista"]],["Sistema","El servidor no arranca: \xABpuerto en uso\xBB","El Hub ya est\xE1 abierto en otra ventana. Ci\xE9rrala, o en PowerShell: netstat -ano | findstr :8080 y taskkill /PID <n\xFAmero> /F.",["admin"]],["Sistema","\xBFQu\xE9 debo respaldar?","La base de datos (pg_dump) y el archivo .data-key juntos. Sin la clave no se pueden leer RUT, correos ni tel\xE9fonos.",["admin"]]];var dr={en:{"u-login":["Sign in",["Keep \u201CKeep me signed in\u201D ticked on your phone so you don\u2019t have to sign in every time. Don\u2019t tick it on shared computers.","Type your email, your RUT or your Hub ID.","Type your password. If you forgot it, ask for a code by email.","First time? Create your account: you only register once."]],"u-reg":["Create account",["Type your RUT with a hyphen (12.345.678-5). If you are not Chilean, choose passport.","Your date of birth. If you are under 18, an adult with a Hub profile must authorise you.","Repeat the password. At the end you\u2019ll get a code by email to activate your account."]],"u-inicio":["Home",["Hub events and announcements. They play on their own; tap one to see the details.","Your QR code. Show it at reception when you come in and when you leave.","When you have a booking, tap \u201CStart your booking\u201D and scan the space\u2019s QR. When you finish, tap \u201CFinish\u201D and go to reception within a few minutes so they can scan your QR.","Your next booking or certification appears here.","At the bottom you switch between Home, Book, My bookings and Profile."]],"u-reservar":["Book",["Choose what you want to book: a room, the gaming room, a lab, a certification or an event.","The cowork area needs no booking: come in with your QR and use any free desk."]],"u-sala":["Book a room",["Choose the day.","Tap one or more consecutive blocks. Grey ones are taken.","Add the people coming with you by their ID or RUT (they must have a profile).","Confirm. The booking appears in My bookings."]],"u-gaming":["Book the gaming room",["Choose the day.","Tap the blocks you want.","Choose a free computer or the whole room for your group.","Confirm the booking."]],"u-lab":["Book a lab",["Choose the lab.","You need the lab\u2019s certification. If you don\u2019t have it, enrol in Certifications.","Upload your work file. The lab manager reviews it before confirming.","Enter the duration, choose the time and confirm. It is deducted from your monthly hours."]],"u-cert":["Certifications",["Each lab requires its own certification. It is taught once a week at the Hub, during the period shown for each one.","Tap \u201CEnrol\u201D in a session with seats left. Full sessions can\u2019t be chosen.","Your enrolment appears in My bookings and in Your next booking."]],"u-eventos":["Events",["Talks, workshops and fairs. Tap one to see the details and sign up.","On the day of the event, check in from Home."]],"u-activas":["My bookings",["Your active bookings and certifications, from the nearest to the furthest.","Cancel at least {cancel_notice_min} minutes in advance to get your hours back.","If you are more than {tolerance_min} minutes late, the booking is released."]],"u-perfil":["Profile",["Update your email, phone or photo.","Check how many lab hours you have left this month.","Sign out if you use a shared computer."]],"u-entrar":["Start your booking",["Check your booking details.","Open the camera and point it at the QR at the entrance of the space. That starts your time.","If the camera doesn\u2019t work, type the code shown under the QR."]],"u-horas":["My hours",["Each lab gives you monthly hours. They reset on the 1st and don\u2019t carry over."]],"u-notif":["Notifications",["Notices about your bookings, cancellations, reviewed files and authorisations for minors."]],"u-hist":["History",["Your past bookings and visits."]],"u-config":["Settings",["Language, appearance, password and privacy of your data."]],"u-priv":["Privacy and my data",["You can ask for a copy of your data or ask for it to be deleted. If you ask for deletion, you keep your account, your certifications, your hours and your bookings.","Delete my account makes it inactive. If you sign up again with the same RUT, you can restore it with a code sent to your previous email."]],"u-reopen":["Restore my account",["Type the code sent to the email of your previous account. You\u2019ll get back your ID, your QR code, your certifications and your hours, with the details you entered when signing up."]]},pt:{"u-login":["Entrar",["Deixe marcado \u201CManter a sess\xE3o iniciada\u201D no seu celular para n\xE3o precisar entrar toda vez. N\xE3o marque em computadores compartilhados.","Digite seu e-mail, seu RUT ou seu ID do Hub.","Digite sua senha. Se esqueceu, pe\xE7a um c\xF3digo por e-mail.","Primeira vez? Crie sua conta: voc\xEA se cadastra uma \xFAnica vez."]],"u-reg":["Criar conta",["Digite seu RUT com h\xEDfen (12.345.678-5). Se for estrangeiro, escolha passaporte.","Sua data de nascimento. Se tiver menos de 18 anos, um adulto com perfil no Hub dever\xE1 autorizar voc\xEA.","Repita a senha. No final voc\xEA receber\xE1 um c\xF3digo por e-mail para ativar a conta."]],"u-inicio":["In\xEDcio",["Eventos e avisos do Hub. Passam sozinhos; toque em um para ver os detalhes.","Seu c\xF3digo QR. Mostre-o na recep\xE7\xE3o ao entrar e ao sair.","Quando tiver uma reserva, toque em \u201CEntrar na sua reserva\u201D e escaneie o QR do espa\xE7o. Ao terminar, toque em \u201CTerminar\u201D e v\xE1 at\xE9 a recep\xE7\xE3o nos minutos seguintes para escanearem seu QR.","Sua pr\xF3xima reserva ou certifica\xE7\xE3o aparece aqui.","Embaixo voc\xEA alterna entre In\xEDcio, Reservar, Minhas reservas e Perfil."]],"u-reservar":["Reservar",["Escolha o que deseja reservar: sala, sala gamer, laborat\xF3rio, certifica\xE7\xE3o ou evento.","O cowork n\xE3o precisa de reserva: entre com seu QR e use qualquer lugar livre."]],"u-sala":["Reservar uma sala",["Escolha o dia.","Toque em um ou mais blocos seguidos. Os cinzas j\xE1 est\xE3o ocupados.","Adicione quem vem com voc\xEA pelo ID ou RUT (precisam ter perfil).","Confirme. A reserva aparece em Minhas reservas."]],"u-gaming":["Reservar a sala gamer",["Escolha o dia.","Toque nos blocos que quiser.","Escolha um computador livre ou a sala inteira para seu grupo.","Confirme a reserva."]],"u-lab":["Reservar um laborat\xF3rio",["Escolha o laborat\xF3rio.","Voc\xEA precisa da certifica\xE7\xE3o do laborat\xF3rio. Se n\xE3o tiver, inscreva-se em Certifica\xE7\xF5es.","Envie o arquivo do seu trabalho. O respons\xE1vel o revisa antes de confirmar.","Informe a dura\xE7\xE3o, escolha o hor\xE1rio e confirme. \xC9 descontado das suas horas do m\xEAs."]],"u-cert":["Certifica\xE7\xF5es",["Cada laborat\xF3rio exige sua certifica\xE7\xE3o. Ela \xE9 dada uma vez por semana no Hub, durante o per\xEDodo indicado em cada uma.","Toque em \u201CInscrever-me\u201D em uma sess\xE3o com vagas. Sess\xF5es lotadas n\xE3o podem ser escolhidas.","Sua inscri\xE7\xE3o aparece em Minhas reservas e em Sua pr\xF3xima reserva."]],"u-eventos":["Eventos",["Palestras, oficinas e feiras. Toque em um para ver os detalhes e se inscrever.","No dia do evento, marque sua presen\xE7a no In\xEDcio."]],"u-activas":["Minhas reservas",["Suas reservas e certifica\xE7\xF5es ativas, da mais pr\xF3xima \xE0 mais distante.","Cancele com pelo menos {cancel_notice_min} minutos de anteced\xEAncia para recuperar suas horas.","Se chegar mais de {tolerance_min} minutos atrasado, a reserva \xE9 liberada."]],"u-perfil":["Perfil",["Atualize seu e-mail, telefone ou foto.","Veja quantas horas de laborat\xF3rio ainda tem neste m\xEAs.","Saia da sua sess\xE3o se usar um computador compartilhado."]],"u-entrar":["Entrar na sua reserva",["Confira os dados da sua reserva.","Abra a c\xE2mera e aponte para o QR que est\xE1 na entrada do espa\xE7o. Assim seu tempo come\xE7a.","Se a c\xE2mera n\xE3o funcionar, digite o c\xF3digo que aparece abaixo do QR."]],"u-horas":["Minhas horas",["Cada laborat\xF3rio d\xE1 horas por m\xEAs a cada pessoa. Elas reiniciam no dia 1 e n\xE3o acumulam."]],"u-notif":["Notifica\xE7\xF5es",["Avisos das suas reservas, cancelamentos, arquivos revisados e autoriza\xE7\xF5es de menores."]],"u-hist":["Hist\xF3rico",["Suas reservas e visitas anteriores."]],"u-config":["Configura\xE7\xF5es",["Idioma, apar\xEAncia, senha e privacidade dos seus dados."]],"u-priv":["Privacidade e meus dados",["Voc\xEA pode pedir uma c\xF3pia dos seus dados ou pedir que sejam exclu\xEDdos. Se pedir a exclus\xE3o, voc\xEA mant\xE9m sua conta, suas certifica\xE7\xF5es, suas horas e suas reservas.","Excluir minha conta a deixa inativa. Se voc\xEA se cadastrar de novo com o mesmo RUT, pode restaur\xE1-la com um c\xF3digo enviado ao seu e-mail anterior."]],"u-reopen":["Restaurar minha conta",["Digite o c\xF3digo enviado ao e-mail da sua conta anterior. Voc\xEA recupera seu ID, seu QR, suas certifica\xE7\xF5es e suas horas, com os dados que digitou no cadastro."]]}},lr={en:[["Getting started","How do I register at the Hub?","Tap \u201CCreate account\u201D, fill in your details (RUT with a hyphen, date of birth, email) and accept the terms. You\u2019ll get a code by email to activate your account. You only register once; you can also do it at reception."],["Getting started","How do I enter and leave the Hub?","Show the QR code on Home at reception when you come in and when you leave. If you don\u2019t have your phone, reception can find you by your RUT."],["Getting started","I forgot my password","On the sign-in screen, type your email, tap \u201CSend code to my email\u201D and use the code you receive (valid for {code_minutes} minutes). Then change it in Profile \u203A Settings."],["Getting started","Do I need to book the cowork area?","No. The cowork area is free to use: come in with your QR and use any free desk."],["Minors","How do I register a minor?","The minor creates an account like anyone else. When entering their date of birth, the system asks for the ID or RUT (or QR) of an adult with a Hub profile. The adult gets a notice on their Home and must tap \u201CYes, I authorise\u201D. From then on, the minor\u2019s profile is active."],["Minors","What does being the responsible adult mean?","Whoever authorises becomes responsible for the minor\u2019s stay at the Hub, including accidents, lost equipment or misconduct. If you don\u2019t want to take that on, tap \u201CNo\u201D."],["Minors","Is there a minimum age?","Yes. Registration accepts people from {min_age} to {max_age} years old."],["Bookings","How do I make a booking?","Go to Book, choose the type of space, the day and one or more consecutive blocks. If others are coming with you, add them by their ID or RUT. Tap \u201CConfirm booking\u201D. You\u2019ll see it in My bookings and on Home."],["Bookings","How do I start my booking?","First check in to the Hub at reception. Then, on Home, tap \u201CStart your booking\u201D and scan the QR at the entrance of the space (or type the code shown under it). You can do it from 10 minutes before. If you don\u2019t confirm within {tolerance_min} minutes, the booking is released. You can also ask reception to start it."],["Bookings","How do I finish my booking?","Tap \u201CFinish\u201D under your QR and go to reception within {finish_window_min} minutes so they can scan your QR. That records your exit from the lab, charges the actual time until you tapped \u201CFinish\u201D and moves you to the cowork area. If you don\u2019t get to reception in time, the finish doesn\u2019t count: your booking stays in progress and you get a notice. If you leave the Hub without tapping \u201CFinish\u201D, scanning your QR at reception records your exit and ends your booking at that moment."],["Bookings","How many bookings can I have?","Up to {max_active} active bookings at a time. Rooms and the gaming room are booked in {block_min}-minute blocks with a {block_gap_min}-minute break."],["Bookings","How do I cancel a booking?","In My bookings, tap \u201CCancel booking\u201D. If you cancel at least {cancel_notice_min} minutes in advance, you get your hours back."],["Bookings","What if I\u2019m late?","You have {tolerance_min} minutes of grace. After that, the booking is released for someone else."],["Labs","How do I request a certification?","Go to Book \u203A Certifications, choose the lab and tap \u201CEnrol\u201D in a session with seats left. You can have one session per certification. Attend the session; the lab manager records the result and, if you pass, you can book that lab."],["Labs","The session says \u201CFull\u201D","There are no seats left in that session. Choose another date; a new one opens every week."],["Labs","How do I book a lab?","With your certification approved, go to Book \u203A Labs, upload your work file, enter how long it takes and choose the time. The lab manager reviews the file and the booking is confirmed."],["Labs","What are my monthly hours?","Each lab gives you a monthly balance of hours. It resets on the 1st and doesn\u2019t carry over. When a job finishes, the actual time is deducted."],["Labs","A machine is not working","In your booking, tap \u201CReport a fault\u201D. The notice goes to the lab manager."],["Events","How do I sign up for an event?","Tap the banner on Home or go to Book \u203A Events and tap \u201CSign up\u201D. On the day of the event, check in from Home."],["Events","The banners move on their own","They change every 5 seconds. If you swipe one or use the arrows, they stop. The pause button turns them back on."],["Account and data","Do I have to sign in every time?","No. When signing in, keep \u201CKeep me signed in on this device\u201D ticked. The session stays open on that phone or computer until you tap \u201CSign out\u201D or change your password. Profile shows whether your session is saved and lets you sign out on your other devices."],["Labs","How do I download my certificate?","In Profile, under Certifications, tap \u201CDownload certificate\u201D next to the certification. It downloads as a PDF."],["Internship","How do I enter the internship office?","If the Hub assigned you an internship, Home shows the \u201CEnter the internship office\u201D button. Check in at reception, tap the button and scan the office\u2019s QR. When you leave, tap \u201CLeave the internship office\u201D. If the office is full, wait for someone to leave."],["Account and data","What does the Hub do with my data?","It uses them to record entries and exits, manage bookings and produce statistics without your name or RUT. They are not shared with third parties. In Profile \u203A Settings \u203A Privacy and my data you can ask for a copy of your data, ask for it to be deleted, or delete your account."],["Account and data","My access says \u201Crestricted\u201D","You have an active penalty. Home shows until when and why. If you think it\u2019s a mistake, talk to reception."],["Account and data","What happens if I ask for my data to be deleted?","The administration reviews the request and deletes your visit history, your files, notes and notifications, and your district, activity, occupation, gender, reduced mobility, phone and photo. You keep your account, your certifications, your hours, your bookings and your penalties. You get an email when it\u2019s done."],["Account and data","I deleted my account and want to come back","Sign up with the same RUT. The system will offer to restore it and send a code to the email it had. You get back your ID, your QR code, your certifications and your hours. If you no longer have that email, go to reception with your ID card."],["Labs","A certification says \u201CNo seats left\u201D","All its sessions in the period are full. Each certification is taught only between the dates it shows. Ask at reception whether more seats will open."]],pt:[["Primeiros passos","Como me cadastro no Hub?","Toque em \u201CCriar conta\u201D, preencha seus dados (RUT com h\xEDfen, data de nascimento, e-mail) e aceite as condi\xE7\xF5es. Voc\xEA receber\xE1 um c\xF3digo por e-mail para ativar a conta. O cadastro \xE9 feito uma \xFAnica vez; tamb\xE9m pode faz\xEA-lo na recep\xE7\xE3o."],["Primeiros passos","Como entro e saio do Hub?","Mostre o c\xF3digo QR do In\xEDcio na recep\xE7\xE3o ao entrar e ao sair. Se estiver sem o celular, a recep\xE7\xE3o pode encontrar voc\xEA pelo RUT."],["Primeiros passos","Esqueci minha senha","Na tela de entrada, digite seu e-mail, toque em \u201CEnviar c\xF3digo para meu e-mail\u201D e use o c\xF3digo recebido (v\xE1lido por {code_minutes} minutos). Depois troque a senha em Perfil \u203A Configura\xE7\xF5es."],["Primeiros passos","Preciso reservar o cowork?","N\xE3o. O cowork \xE9 de uso livre: entre com seu QR e use um lugar dispon\xEDvel."],["Menores de idade","Como cadastro um menor de idade?","O menor cria sua conta como qualquer pessoa. Ao informar a data de nascimento, o sistema pede o ID ou o RUT (ou o QR) de um adulto com perfil no Hub. O adulto recebe um aviso no In\xEDcio e deve tocar em \u201CSim, autorizo\u201D. A partir da\xED o perfil do menor fica ativo."],["Menores de idade","O que significa ser o adulto respons\xE1vel?","Quem autoriza fica respons\xE1vel pela perman\xEAncia do menor no Hub, incluindo acidentes, perda de equipamento ou mau comportamento. Se n\xE3o quiser assumir, toque em \u201CN\xE3o\u201D."],["Menores de idade","Existe idade m\xEDnima?","Sim. O cadastro aceita pessoas de {min_age} a {max_age} anos."],["Reservas","Como fa\xE7o uma reserva?","V\xE1 em Reservar, escolha o tipo de espa\xE7o, o dia e um ou mais blocos seguidos. Se vier com outras pessoas, adicione-as pelo ID ou RUT. Toque em \u201CConfirmar reserva\u201D. Voc\xEA a ver\xE1 em Minhas reservas e no In\xEDcio."],["Reservas","Como come\xE7o minha reserva?","Primeiro registre sua entrada no Hub na recep\xE7\xE3o. Depois, no In\xEDcio, toque em \u201CEntrar na sua reserva\u201D e escaneie o QR que est\xE1 na entrada do espa\xE7o (ou digite o c\xF3digo que aparece abaixo dele). Voc\xEA pode fazer isso a partir de 10 minutos antes. Se n\xE3o confirmar em {tolerance_min} minutos, a reserva \xE9 liberada. Tamb\xE9m pode pedir \xE0 recep\xE7\xE3o que a inicie."],["Reservas","Como termino minha reserva?","Toque em \u201CTerminar\u201D abaixo do seu QR e v\xE1 at\xE9 a recep\xE7\xE3o nos pr\xF3ximos {finish_window_min} minutos para escanearem seu QR. Assim sua sa\xEDda do laborat\xF3rio fica registrada, \xE9 descontado o tempo real at\xE9 o momento em que tocou em \u201CTerminar\u201D e voc\xEA fica no cowork. Se n\xE3o passar pela recep\xE7\xE3o a tempo, o t\xE9rmino n\xE3o \xE9 considerado: sua reserva continua em andamento e voc\xEA recebe um aviso. Se sair do Hub sem tocar em \u201CTerminar\u201D, ao escanear seu QR na recep\xE7\xE3o sua sa\xEDda \xE9 registrada e a reserva termina nesse momento."],["Reservas","Quantas reservas posso ter?","At\xE9 {max_active} reservas ativas ao mesmo tempo. As salas e a sala gamer s\xE3o reservadas em blocos de {block_min} minutos com {block_gap_min} minutos de intervalo."],["Reservas","Como cancelo uma reserva?","Em Minhas reservas, toque em \u201CCancelar reserva\u201D. Se cancelar com pelo menos {cancel_notice_min} minutos de anteced\xEAncia, suas horas s\xE3o devolvidas."],["Reservas","E se eu me atrasar?","Voc\xEA tem {tolerance_min} minutos de toler\xE2ncia. Depois disso, a reserva \xE9 liberada para outra pessoa."],["Laborat\xF3rios","Como pe\xE7o uma certifica\xE7\xE3o?","V\xE1 em Reservar \u203A Certifica\xE7\xF5es, escolha o laborat\xF3rio e toque em \u201CInscrever-me\u201D em uma sess\xE3o com vagas. Voc\xEA pode ter uma sess\xE3o por certifica\xE7\xE3o. Participe da sess\xE3o; o respons\xE1vel registra o resultado e, se for aprovado, j\xE1 pode reservar esse laborat\xF3rio."],["Laborat\xF3rios","A sess\xE3o diz \u201CLotada\u201D","N\xE3o h\xE1 vagas nessa sess\xE3o. Escolha outra data; toda semana abre uma nova."],["Laborat\xF3rios","Como reservo um laborat\xF3rio?","Com a certifica\xE7\xE3o aprovada, v\xE1 em Reservar \u203A Laborat\xF3rios, envie o arquivo do seu trabalho, informe  meus dados voc\xEA pode pedir uma c\xF3pia ou a exclus\xE3o dos seus dados, ou excluir sua conta."],["Conta e dados","Meu acesso diz \u201Crestrito\u201D","Voc\xEA tem uma penalidade vigente. O In\xEDcio mostra at\xE9 quando e o motivo. Se achar que \xE9 um erro, fale com a recep\xE7\xE3o."],["Conta e dados","O que acontece se eu pedir a exclus\xE3o dos meus dados?","A administra\xE7\xE3o revisa o pedido e exclui seu hist\xF3rico de visitas, seus arquivos, observa\xE7\xF5es e avisos, e sua comuna, atividade, ocupa\xE7\xE3o, g\xEAnero, mobilidade reduzida, celular e foto. Voc\xEA mant\xE9m sua conta, suas certifica\xE7\xF5es, suas horas, suas reservas e suas penalidades. Voc\xEA recebe um e-mail quando for feito."],["Conta e dados","Exclu\xED minha conta e quero voltar","Cadastre-se com o mesmo RUT. O sistema vai oferecer restaur\xE1-la e enviar um c\xF3digo ao e-mail que ela tinha. Voc\xEA recupera seu ID, seu QR, suas certifica\xE7\xF5es e suas horas. Se n\xE3o tiver mais esse e-mail, v\xE1 \xE0 recep\xE7\xE3o com seu documento."],["Laborat\xF3rios","Uma certifica\xE7\xE3o diz \u201CSem vagas\u201D","Todas as sess\xF5es do per\xEDodo est\xE3o lotadas. Cada certifica\xE7\xE3o \xE9 dada s\xF3 entre as datas indicadas. Pergunte na recep\xE7\xE3o se v\xE3o abrir mais vagas."]]};var Rt=e=>nr(e,a=>v()?.cfg(a));var ur={"u-login":{title:"Ingresar",steps:[['[data-i="l_keep"]',"Deja marcado \xABMantener la sesi\xF3n iniciada\xBB en tu tel\xE9fono para no ingresar cada vez. No lo marques en equipos compartidos."],['[data-i="l_ident"]',"Escribe tu correo, tu RUT o tu ID del Hub."],['[data-i="l_pass"]',"Escribe tu contrase\xF1a. Si la olvidaste, pide un c\xF3digo al correo."],['[data-a="go"][data-v="u-reg"]',"\xBFPrimera vez? Crea tu cuenta: te registras una sola vez."]]},"u-reg":{title:"Crear cuenta",steps:[['[data-i="r_doc"]',"Escribe tu RUT con guion (12.345.678-5). Si eres extranjero, elige pasaporte."],['[data-i="r_birth"]',"Tu fecha de nacimiento. Si eres menor de 18, un
