# Publica la demo (carpeta web/) en GitHub Pages cada vez que se sube un cambio a la rama main.
# Dos trabajos: "build" arma y sube el sitio; "deploy" lo publica. Separarlos evita que la publicación
# busque el sitio antes de que GitHub lo registre, y que un reintento parcial deje dos copias.
# Si aun así GitHub tarda en listar el sitio (falla intermitente de noviembre de 2026), se reintenta una vez.
name: Publicar demo en GitHub Pages
on:
  push: { branches: [ main ] }
  workflow_dispatch:
permissions: { contents: read, pages: write, id-token: write }
concurrency: { group: pages, cancel-in-progress: false }
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci && npm test && npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: web }
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: "${{ steps.d1.outputs.page_url || steps.d2.outputs.page_url }}" }
    steps:
      - id: d1
        uses: actions/deploy-pages@v4
        continue-on-error: true
      - if: steps.d1.outcome == 'failure'
        run: sleep 30
      - id: d2
        if: steps.d1.outcome == 'failure'
        uses: actions/deploy-pages@v4
